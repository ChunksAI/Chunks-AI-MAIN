<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Chunks AI — Redirecting…</title>
  <script>
    // ── Thin redirect shell ────────────────────────────────────────────
    // All sign-in is now handled by homepage.html (/ChunksAI).
    // This file exists only so that:
    //   (a) old Supabase redirect_to=.../login callbacks still work
    //   (b) old bookmarks / links to /login don't 404
    //
    // Strategy:
    //   • OAuth callback (?code= or #access_token) → forward to /ChunksAI
    //     preserving the code/hash so homepage can complete the exchange.
    //   • Any other visit → redirect to /ChunksAI (homepage).
    (function() {
      var search = location.search;
      var hash   = location.hash;
      var hasCode = search.includes('code=');
      var hasHash = hash.includes('access_token');

      if (hasCode || hasHash) {
        // Forward OAuth callback to homepage so it can handle the code exchange
        var dest = '/ChunksAI' + search + hash;
        location.replace(dest);
      } else {
        // Regular visit — go to homepage
        location.replace('/ChunksAI');
      }
    })();
  </script>
</head>
<body></body>
</html>
