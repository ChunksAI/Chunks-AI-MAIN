# ── k8s/secret.yaml — SECRET TEMPLATE ────────────────────────────────────────
#
# DO NOT commit real values.  This file contains placeholder strings that you
# must replace before applying.  The recommended workflow is:
#
#   # Option A — edit this file locally (never commit the result):
#   kubectl apply -f k8s/secret.yaml -n chunks
#
#   # Option B — create from env file (preferred):
#   kubectl create secret generic chunks-api-secret \
#     --from-env-file=.env \
#     --namespace=chunks \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   # Option C — use an external secrets manager (Vault, AWS Secrets Manager,
#   #             GCP Secret Manager) with the Kubernetes External Secrets
#   #             Operator (https://external-secrets.io).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: chunks-api-secret
  namespace: chunks
type: Opaque
# stringData accepts plain-text values (base64 encoding is handled by K8s).
# Replace every REPLACE_ME value before applying.
stringData:
  OPENROUTER_API_KEY: "REPLACE_ME"
  SUPABASE_URL: "REPLACE_ME"
  SUPABASE_SERVICE_KEY: "REPLACE_ME"
  SUPABASE_ANON_KEY: "REPLACE_ME"
  SUPABASE_JWT_SECRET: "REPLACE_ME"
  R2_BUCKET_URL: "REPLACE_ME"
  # Optional — leave empty to disable Sentry error monitoring.
  SENTRY_DSN: ""
