[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -r requirements.lock"]

[start]
cmd = "gunicorn server:app --worker-class uvicorn.workers.UvicornWorker --workers 4 --timeout 120 --graceful-timeout 30 --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - --max-requests 1000 --max-requests-jitter 100"
