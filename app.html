<style>
  /* Performance: don't block paint — show skeleton instantly, fade content in */
  html { scroll-behavior: auto !important; }
  body { opacity: 0; }
  /* Use animation-fill-mode so FCP is measured on actual content, not blank screen */
  body.chunks-ready { animation: _chunks-fadein 0.15s ease forwards; }
  @keyframes _chunks-fadein { from { opacity: 0; } to { opacity: 1; } }
  /* Critical above-the-fold skeleton — visible immediately, replaced by real UI */

</style>
<script>
  // ── Force all dynamic HTTP → HTTPS ───────────────────────────────────────
  // Prevents mixed content warnings from dynamically set image/resource URLs
  (function() {
    const _origSet = Object.getOwnPropertyDescriptor(CSSStyleDeclaration.prototype, 'backgroundImage');
    if (_origSet && _origSet.set) {
      Object.defineProperty(CSSStyleDeclaration.prototype, 'backgroundImage', {
        set: function(val) {
          _origSet.set.call(this, val ? val.replace(/http:\/\//g, 'https://') : val);
        },
        get: _origSet.get
      });
    }
    // Also intercept img src
    const _origSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    if (_origSrc && _origSrc.set) {
      Object.defineProperty(HTMLImageElement.prototype, 'src', {
        set: function(val) {
          _origSrc.set.call(this, typeof val === 'string' ? val.replace(/^http:\/\//i, 'https://') : val);
        },
        get: _origSrc.get
      });
    }
  })();

  // Prevent browser scroll restore on refresh
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);

  // ── Unified pre-render auth gate ───────────────────────────────────────────
  // Single entry point for both authenticated and guest users.
  // If no valid session exists, activate guest mode instead of redirecting.
  (function() {
    var hasCode      = location.search.includes('code=');
    var hasHash      = location.hash.includes('access_token');
    var isOAuthCb    = sessionStorage.getItem('chunks_oauth_callback') === '1';
    var isSigningOut = sessionStorage.getItem('chunks_signing_out') === '1';
    // Let OAuth callbacks land here safely before we decide
    if (hasCode || hasHash || isOAuthCb) return;
    // After sign-out we stay on the page in guest mode; just clear the flag
    if (isSigningOut) {
      sessionStorage.removeItem('chunks_signing_out');
      sessionStorage.setItem('chunks_guest_mode', '1');
      return;
    }
    // Check for an existing authenticated session
    try {
      var raw = localStorage.getItem('chunks-ai-auth');
      if (raw) {
        var parsed  = JSON.parse(raw);
        var session = parsed.access_token ? parsed
                    : (parsed.currentSession && parsed.currentSession.access_token)
                      ? parsed.currentSession : null;
        if (session && session.access_token) return; // authenticated — proceed
        // Token expired? DO NOT redirect — auth.js will refresh via Supabase SDK
      }
    } catch(e) {
      try { localStorage.removeItem('chunks-ai-auth'); } catch(_) {}
    }
    // Not authenticated — activate guest mode
    sessionStorage.setItem('chunks_guest_mode', '1');
  })();
</script>
<script>
  // ── Instant theme restore — runs before any CSS renders ──────────────────
  // Apply Study Mode by default; only switch to dark if explicitly saved.
  (function() {
    try {
      var saved = localStorage.getItem('chunks_setting_appearance');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'study');
      }
    } catch(e) {}
  })();
</script>
